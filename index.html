<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UniCoPlan</title>
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#05080E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Inter:wght@400;500;600;700&family=Chakra+Petch:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-950:#05080E; --navy-900:#0B1220; --navy-800:#101B2E; --navy-border:#1B2A45;
    --blue:#3E8EFF; --blue-dark:#2569D6; --blue-soft:#12294A; --blue-soft-border:#2A4C82;
    --ink:#EAF2FF; --ink-soft:#8098BE; --red:#F87171; --red-soft:#3A1620; --red-border:#5A2430;
  }
  *{ box-sizing:border-box; }
  body{
    position:relative; margin:0; min-height:100vh; background:var(--navy-950); color:var(--ink);
    font-family:'Inter', system-ui, sans-serif;
    display:flex; align-items:center; justify-content:center; padding:24px;
    overflow-x:hidden;
  }
  /* Atmospheric space backdrop — matches the admin/student panels: a soft
     blue light beam from the top-left plus a scattered starfield, both
     fixed behind the sign-in card. */
  body::before{
    content:''; position:fixed; top:0; right:0; bottom:0; left:0; z-index:0; pointer-events:none;
    background:
      linear-gradient(128deg, rgba(94,163,255,.28) 0%, rgba(62,142,255,.14) 18%, transparent 42%),
      radial-gradient(1100px 750px at -8% -12%, rgba(62,142,255,.40), transparent 55%),
      radial-gradient(760px 480px at 20% 4%, rgba(120,180,255,.22), transparent 62%);
  }
  body::after{
    content:''; position:fixed; top:0; right:0; bottom:0; left:0; z-index:0; pointer-events:none; opacity:.85;
    background-image:
      radial-gradient(2px 2px at 8% 10%, #fff, transparent 60%),
      radial-gradient(2px 2px at 21% 34%, #cfe0ff, transparent 60%),
      radial-gradient(2.5px 2.5px at 34% 14%, #fff, transparent 60%),
      radial-gradient(2px 2px at 47% 46%, #fff, transparent 60%),
      radial-gradient(2px 2px at 61% 22%, #cfe0ff, transparent 60%),
      radial-gradient(2.5px 2.5px at 73% 56%, #fff, transparent 60%),
      radial-gradient(2px 2px at 84% 16%, #fff, transparent 60%),
      radial-gradient(2px 2px at 91% 63%, #cfe0ff, transparent 60%),
      radial-gradient(2px 2px at 6% 72%, #fff, transparent 60%),
      radial-gradient(2.5px 2.5px at 27% 84%, #fff, transparent 60%),
      radial-gradient(2px 2px at 54% 90%, #cfe0ff, transparent 60%),
      radial-gradient(2px 2px at 79% 94%, #fff, transparent 60%);
  }
  .wrap{ position:relative; z-index:1; width:100%; max-width:420px; text-align:center; }
  .brand{
    font-family:'Chakra Petch', sans-serif; font-weight:700; font-size:2.1rem;
    letter-spacing:.02em; margin:0 0 8px;
  }
  .sub{ color:var(--ink-soft); margin:0 0 32px; font-size:1.02rem; }
  .card{
    background:rgba(11,18,32,.72); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    border:1px solid var(--navy-border);
    border-radius:14px; padding:32px 28px;
    box-shadow:0 10px 28px rgba(0,0,0,.45), 0 0 0 1px rgba(62,142,255,.05);
  }
  .card h2{ margin:0 0 8px; font-family:'Chakra Petch', sans-serif; font-size:1.1rem; }
  .card p{ margin:0 0 22px; color:var(--ink-soft); font-size:.9rem; line-height:1.5; }
  .card p:last-child{ margin-bottom:0; }
  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:10px;
    border:none; border-radius:10px; padding:12px 22px; font-size:.95rem;
    font-family:'Inter', system-ui, sans-serif; font-weight:600; cursor:pointer;
    text-decoration:none; transition:background .15s ease, opacity .15s ease;
  }
  .btn-primary{ background:var(--blue); color:#05080E; width:100%; }
  .btn-primary:hover{ background:var(--blue-dark); }
  .btn-ghost{ background:transparent; color:var(--ink); border:1px solid var(--navy-border); width:100%; }
  .btn-ghost:hover{ border-color:var(--blue-soft-border); }
  .btn:disabled{ opacity:.6; cursor:default; }
  .google-icon{ width:18px; height:18px; flex:none; }
  .status-email{ color:var(--ink); font-weight:600; }
  .not-auth-box{
    background:var(--red-soft); border:1px solid var(--red-border); color:var(--red);
    border-radius:10px; padding:10px 14px; font-size:.85rem; margin-bottom:18px; text-align:left;
  }
  .spinner{
    width:22px; height:22px; margin:4px auto 18px; border-radius:50%;
    border:2.5px solid var(--navy-border); border-top-color:var(--blue);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .fine-print{ margin-top:22px; color:var(--ink-soft); font-size:.78rem; line-height:1.6; }
</style>
</head>
<body>
  <div class="wrap">
    <h1 class="brand">UniCoPlan</h1>
    <p class="sub">Semester planning, without the clashes.</p>
    <div class="card" id="authCard">
      <div class="spinner"></div>
      <p>Checking your session…</p>
    </div>
    <p class="fine-print">
      Admin access is limited to the assigned admin account.<br>
      Student access is limited to <strong>@std.ewubd.edu</strong> accounts.
    </p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
  <script>
    // Same project the admin/student panels use — see README "Login & access
    // control". This page's only job is: sign in with Google once, ask
    // Supabase which role the account has, and send the browser straight to
    // the right panel. It never decides access itself — current_app_role()
    // in the database is the real source of truth, same as in both panels.
    const SUPABASE_URL = 'https://jxvpdkpfsexzovbzrrhf.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp4dnBka3Bmc2V4em92YnpycmhmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkzOTk2NzgsImV4cCI6MjEwNDk3NTY3OH0.RY7PpZjBvq5FucTUNKtVF2vmMVyw4aysm91FuJYGVbU';
    const sb = (typeof window.supabase !== 'undefined')
      ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
      : null;

    const card = document.getElementById('authCard');

    function escapeHtml(s){
      return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    function renderSignedOut(){
      card.innerHTML = `
        <h2>Sign in to continue</h2>
        <p>One Google account, one sign-in — you'll land on the right panel automatically.</p>
        <button type="button" class="btn btn-primary" id="signInBtn">
          <svg class="google-icon" viewBox="0 0 48 48" aria-hidden="true">
            <path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3c-1.6 4.7-6.1 8-11.3 8-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6 29.5 4 24 4 12.9 4 4 12.9 4 24s8.9 20 20 20 20-8.9 20-20c0-1.3-.1-2.7-.4-3.5z"/>
            <path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.6 15.6 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6 29.5 4 24 4 16.3 4 9.6 8.3 6.3 14.7z"/>
            <path fill="#4CAF50" d="M24 44c5.4 0 10.3-1.9 14-5.9l-6.5-5.5C29.5 34.4 26.9 35 24 35c-5.2 0-9.6-3.3-11.3-8l-6.6 5.1C9.5 39.6 16.2 44 24 44z"/>
            <path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.3-2.2 4.3-4 5.6l6.5 5.5C41.4 36 44 30.5 44 24c0-1.3-.1-2.7-.4-3.5z"/>
          </svg>
          Sign in with Google
        </button>
      `;
      const btn = document.getElementById('signInBtn');
      if (btn) btn.addEventListener('click', signInWithGoogle);
    }

    function renderRedirecting(target){
      card.innerHTML = `
        <div class="spinner"></div>
        <p>You're signed in — taking you to the ${target === 'admin' ? 'admin' : 'student'} panel…</p>
      `;
    }

    function renderNotAuthorized(email){
      card.innerHTML = `
        <h2>Not authorized</h2>
        <div class="not-auth-box"><span class="status-email">${escapeHtml(email)}</span> doesn't have access to UniCoPlan.</div>
        <p>Admins sign in with the assigned admin account. Students sign in with their <strong>@std.ewubd.edu</strong> account.</p>
        <button type="button" class="btn btn-ghost" id="signOutBtn">Sign out</button>
      `;
      const btn = document.getElementById('signOutBtn');
      if (btn) btn.addEventListener('click', () => sb.auth.signOut());
    }

    function renderUnavailable(){
      card.innerHTML = `
        <h2>Sign-in unavailable</h2>
        <p>Couldn't reach the sign-in service. Check your connection and reload the page.</p>
      `;
    }

    function signInWithGoogle(){
      if (!sb) return;
      sb.auth.signInWithOAuth({
        provider: 'google',
        options: { redirectTo: window.location.origin + window.location.pathname }
      });
    }

    async function resolveAndRoute(session){
      if (!session){ renderSignedOut(); return; }
      try {
        const { data, error } = await sb.rpc('current_app_role');
        if (error) throw error;
        const role = data || 'none';
        if (role === 'admin' || role === 'main_admin'){
          renderRedirecting('admin');
          window.location.replace('admin_panel/admin_index.html');
        } else if (role === 'student'){
          renderRedirecting('student');
          window.location.replace('student_panel/Std_index.html');
        } else {
          renderNotAuthorized(session.user.email);
        }
      } catch (e){
        console.error('Could not resolve access level.', e);
        renderNotAuthorized(session.user.email);
      }
    }

    async function init(){
      if (!sb){ renderUnavailable(); return; }
      const { data } = await sb.auth.getSession();
      await resolveAndRoute(data.session);

      // Handles the redirect back from Google (and sign-out) after this
      // initial check.
      sb.auth.onAuthStateChange((_event, session) => { resolveAndRoute(session); });
    }

    init();
  </script>
</body>
</html>
